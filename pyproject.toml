[project]
name = "uniops"
version = "0.1.3"
description = "Operational backbone for UniGreen"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "anyio>=4.9,<4.10",
  "argon2-cffi>=23,<26",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
uniops = "app.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
