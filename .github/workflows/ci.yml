name: CI

# Runs on every pull request and every push to main, and is called by the
# release workflow so that a tag can never be cut from an untested commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# One run per ref. A new push supersedes the one still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nothing here reaches a real system, but the suite must not pick up an
  # operator's values either, so the live EasyBooks path is off everywhere.
  UNIOPS_EASYBOOKS_LIVE_ENABLED: "false"

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check backend
      - name: Tests
        run: uv run pytest

  backend-postgres:
    # PostgreSQL is what the deployment actually runs on, so the suite runs
    # there too. SQLite alone would leave dialect differences to be found by an
    # operator during a migration.
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: uniops
          POSTGRES_USER: uniops
          POSTGRES_PASSWORD: uniops-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniops -d uniops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups
      - name: Tests
        env:
          UNIOPS_TEST_DATABASE_URL: postgresql+psycopg://uniops:uniops-ci@127.0.0.1:5432/uniops
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        # `npm run build` is `tsc -b && vite build`, so this covers src/, the
        # Vite config and the e2e specs in one step.
        run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    # The harness builds the SPA, seeds a throwaway SQLite database from the
    # checked-in EasyBooks fixture and serves both from one uvicorn, so this job
    # needs Python and Node together. It never reaches a real EasyBooks.
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-groups
      - run: npm ci
        working-directory: frontend
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Specs
        run: npx playwright test
        working-directory: frontend
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
